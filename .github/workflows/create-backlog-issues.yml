name: Create Backlog Issues

# Run once manually after enabling repo read/write permissions for GITHUB_TOKEN.
# Requires a PAT stored as PROJECT_PAT with scopes: repo, project.
# Actions > "Create Backlog Issues" > "Run workflow"
on:
  workflow_dispatch:
    inputs:
      project_number:
        description: "GitHub Project board number (default: 1)"
        required: false
        default: "1"

jobs:
  create-issues:
    name: Create all 22 backlog issues and add to project board
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create issues and add to project board
        env:
          # PROJECT_PAT must be a classic PAT (not fine-grained) with
          # 'repo' and 'project' scopes, belonging to an account that has
          # write access to the Envision-Perdido org project board.
          # Create one at https://github.com/settings/tokens?type=legacy
          # and store it as a repository secret named PROJECT_PAT.
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          PROJECT_OWNER: Envision-Perdido
        run: bash scripts/ops/create-backlog-issues.sh
